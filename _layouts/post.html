---
layout: default
---

<article class="blog-post">
  <header class="blog-post-header">
    <a href="{{ '/blog' | relative_url }}" class="blog-back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Blog
    </a>
    <time class="blog-post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %Y" }}</time>
    <h1 class="blog-post-title">{{ page.title }}</h1>
  </header>

  <div class="blog-post-content">
    {{ content }}
  </div>

  <div style="background-color:#FFFFFF; border:1px solid #EDF0E5; border-radius:10px; padding:32px; margin:40px 0; text-align:center; font-family:Arial, Helvetica, sans-serif;">
    <div style="font-size:18px; color:#3E3B32; font-weight:600; margin-bottom:8px;">
      Enjoyed this?
    </div>
    <div style="font-size:14px; color:#6B6B63; margin-bottom:18px; max-width:420px; margin-left:auto; margin-right:auto; line-height:1.6;">
      Get a short, honest note on wellbeing like this one, once a month, straight to your inbox.
    </div>

    <a href="https://zc.vg/Tgg9S" target="_blank" rel="noopener"
      style="display:inline-block; padding:11px 28px; background-color:#5C7A5C; color:#FFFFFF; border-radius:6px; font-size:14px; font-weight:bold; text-decoration:none; font-family:Arial, Helvetica, sans-serif;">
      Subscribe
    </a>

  </div>

  <footer class="blog-post-footer">
    <div class="blog-post-author">
      <p class="blog-post-author-name">Rizqa Armien-Yang</p>
      <p class="blog-post-author-role">Mental Wellness Coach, Still Willows</p>
    </div>
    <a href="{{ '/contact' | relative_url }}" class="btn">Book a Discovery Call</a>
  </footer>
</article>
